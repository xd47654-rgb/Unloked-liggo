<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b12"><title>Unlocked Liggo</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,Arial}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0%,#342052 0,transparent 42%),#090b12;color:#f7f5ff;min-height:100vh}.wrap{max-width:650px;margin:auto;padding:28px 20px 40px}.brand{display:flex;align-items:center;gap:12px;margin:10px 0 28px}.logo{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,#ff5f9e,#8d5bff);display:grid;place-items:center;font-size:25px;box-shadow:0 8px 30px #b34b9850}.brand h1{font-size:22px;margin:0}.brand p{margin:3px 0 0;color:#aaa5bb;font-size:12px}.hero{margin-bottom:22px}.hero h2{font-size:29px;line-height:1.1;margin:0 0 9px}.hero p{color:#aaa5bb;margin:0;font-size:14px}.panel{background:#151722;border:1px solid #292b3b;border-radius:22px;padding:18px;margin:15px 0}.label{font-size:13px;color:#c9c3d9;margin-bottom:10px;display:block}textarea{width:100%;min-height:135px;resize:vertical;background:#0d0f18;color:white;border:1px solid #303247;border-radius:14px;padding:14px;font:15px inherit;outline:none}textarea:focus{border-color:#bd69ff}.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.mode{border:1px solid #34364b;border-radius:13px;padding:12px;background:#10121c;color:#e9e5f3;text-align:left;font-size:13px}.mode.active{border-color:#ce73ff;background:#2a1937}.btn{width:100%;border:0;border-radius:14px;padding:15px;background:linear-gradient(100deg,#ff5e9d,#9b62ff);color:white;font-weight:800;font-size:15px;margin-top:15px}.result{display:none;white-space:pre-wrap;line-height:1.5;background:#0d0f18;border:1px solid #35364b;padding:14px;border-radius:14px;margin-top:13px}.copy{background:#28243a;color:#e9d9ff;border:0;border-radius:10px;padding:10px 13px;margin-top:10px}.hint{font-size:11px;color:#88869a;line-height:1.5;margin-top:16px}.foot{text-align:center;color:#6e6b7c;font-size:11px;margin-top:28px}
</style></head><body><main class="wrap"><header class="brand"><div class="logo">💬</div><div><h1>Unlocked Liggo</h1><p>Respuestas con estilo</p></div></header><section class="hero"><h2>¿Qué te han dicho?</h2><p>Pega el mensaje y elige cómo quieres responder.</p></section><section class="panel"><label class="label" for="msg">MENSAJE QUE HAS RECIBIDO</label><textarea id="msg" placeholder="Pega aquí la conversación o el mensaje..."></textarea></section><section class="panel"><span class="label">ELIGE TU ESTILO</span><div class="modes" id="modes"><button class="mode active" data-mode="Ingenioso">🧠 Ingenioso</button><button class="mode" data-mode="Gracioso">😂 Gracioso</button><button class="mode" data-mode="Elegante">✨ Elegante</button><button class="mode" data-mode="Directo">🎯 Directo</button><button class="mode" data-mode="Tranquilo">😎 Tranquilo</button><button class="mode" data-mode="Cortante sin insultar">🧊 Cortante</button></div><button class="btn" id="make">CREAR RESPUESTA</button><div class="result" id="result"></div><button class="copy" id="copy" style="display:none">Copiar respuesta</button><p class="hint">Versión inicial gratuita: genera ideas básicas en el dispositivo. No envía mensajes ni guarda tus conversaciones.</p></section><div class="foot">UNLOCKED LIGGO · VERSIÓN 1.0</div></main>
<script>
let mode='Ingenioso';document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode});
function generate(t,m){let s=t.trim();if(!s)return 'Primero pega un mensaje para preparar una respuesta.';let starters={Ingenioso:['Interesante punto… aunque creo que se te escapó un detalle: ','Buena teoría. Ahora falta que encaje con los hechos: '],Gracioso:['JAJA, esa respuesta venía con confianza incluida. ','No esperaba ese giro, la verdad. '],Elegante:['Entiendo lo que dices, pero no comparto del todo esa idea. ','Prefiero responder con claridad: '],Directo:['Te lo digo claro: ','Voy al grano: '],Tranquilo:['Todo bien, pero quiero aclarar algo: ','Sin malos rollos, simplemente: '],'Cortante sin insultar':['Cuando tengas un argumento, seguimos. ','No voy a discutir por discutir. ']};let a=starters[m];return a[Math.floor(Math.random()*a.length)]+(s.length>115?'he leído lo que dices y prefiero que hablemos con argumentos y respeto.':'creo que podemos hablarlo con más claridad y sin sacar conclusiones precipitadas.');}
document.getElementById('make').onclick=()=>{let r=document.getElementById('result');r.textContent=generate(document.getElementById('msg').value,mode);r.style.display='block';document.getElementById('copy').style.display='inline-block'};document.getElementById('copy').onclick=()=>{let t=document.getElementById('result').textContent;if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>document.getElementById('copy').textContent='¡Copiado!').catch(()=>fallback(t));else fallback(t)};function fallback(t){let x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove();document.getElementById('copy').textContent='¡Copiado!'}
</script></body></html>
